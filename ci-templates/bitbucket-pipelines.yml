# Penetrify scan step for Bitbucket Pipelines.
# Repository variables (secured): PENETRIFY_API_KEY, PENETRIFY_APP_ID, SCAN_URL.
definitions:
  steps:
    - step: &penetrify-scan
        name: Penetrify security scan
        image: alpine:3.20
        max-time: 90
        script:
          - apk add --no-cache curl
          - curl -fsSL https://downloads.penetrify.cloud/cli/install.sh | PENETRIFY_INSTALL_DIR=/usr/local/bin sh
          - export PENETRIFY_AUTHORIZED=true   # you own / are authorized to test SCAN_URL
          - penetrify scan "$SCAN_URL" --app "$PENETRIFY_APP_ID" --mode standard --fail-on critical,high --format json --output penetrify-report.json
        # NOTE: the report contains exploitable findings (URLs, evidence) — restrict who can read these artifacts.
        artifacts:
          - penetrify-report.json
pipelines:
  branches:
    main:
      - step:
          name: Deploy to staging
          script:
            - ./scripts/deploy-staging.sh
      - step: *penetrify-scan
